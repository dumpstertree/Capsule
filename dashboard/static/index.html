<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Capsule</title>
  <link rel="stylesheet" href="/static/style.css?v=2">
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Capsule <span class="dim">dashboard</span></h1>
      <div>
        <button id="refresh">Refresh</button>
        <button id="logout">Log out</button>
      </div>
    </header>
    <div class="notice" id="notice"></div>
    <div class="grid" id="capsules">
      <div class="empty">Loading…</div>
    </div>
  </div>

  <!-- games & libraries manager -->
  <div class="modal-overlay" id="modal" style="display:none">
    <div class="modal">
      <div class="modal-head">
        <h2 id="mgr-title">Games</h2>
        <button id="mgr-close" title="Close">&#10005;</button>
      </div>
      <div class="notice" id="mgr-notice"></div>
      <div class="hint" id="mgr-hints"></div>

      <section>
        <h3>Steam library folders</h3>
        <ul class="mgr-list" id="mgr-libs"><li class="dim">Loading…</li></ul>
        <div class="mgr-form">
          <input id="lib-path" type="text" placeholder="/mnt/games" spellcheck="false">
          <button id="lib-browse">Browse…</button>
          <button id="lib-add" class="primary">Add drive</button>
        </div>
        <div class="hint">Drive must be mounted inside the container (Proxmox bind mount). Steam rescans on next start.</div>
      </section>

      <section>
        <h3>Non-Steam games</h3>
        <ul class="mgr-list" id="mgr-games"><li class="dim">Loading…</li></ul>
        <div class="mgr-form">
          <input id="game-exe" type="text" placeholder="/mnt/games/GameName/game.exe" spellcheck="false">
          <button id="game-browse">Browse…</button>
        </div>
        <div class="mgr-form">
          <input id="game-name" type="text" placeholder="Display name (default: exe name)" spellcheck="false">
          <input id="game-sgdb" type="number" placeholder="SteamGridDB id (optional, skips search)" min="1">
        </div>
        <div class="mgr-form">
          <input id="game-opts" type="text" placeholder="Launch options (optional)" spellcheck="false">
          <button id="game-add" class="primary">Import game</button>
        </div>
        <div class="hint">Importing stops and restarts Steam for this capsule. Artwork and names come from SteamGridDB.</div>
      </section>

      <section class="browser" id="browser" style="display:none">
        <div class="browser-head">
          <b id="browser-path">/</b>
          <span class="spacer"></span>
          <button id="browser-up">..</button>
          <button id="browser-choose">Choose this folder</button>
          <button id="browser-cancel">Cancel</button>
        </div>
        <div class="browser-dirs" id="browser-dirs"></div>
      </section>
    </div>
  </div>

  <script src="/static/app.js?v=2"></script>
</body>
</html>
