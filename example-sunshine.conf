# Capsule Sunshine template — patched at install time by preconfig-sunshine.sh
# (port + csrf_allowed_origins). Browse the UI at https://<host>:<port + 1>.

capture = x11
origin_web_ui_allowed = lan
min_log_level = 4
system_tray = disabled
touchpad_as_ds4 = disabled
motion_as_ds4 = disabled
native_pen_touch = disabled
upnp = disabled
port = 47989
csrf_allowed_origins = https://localhost
