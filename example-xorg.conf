# Capsule Xorg config — headless dummy display.
#
# Each capsule gets one of these. Dummy provides a RAM-backed X screen so N
# capsules can coexist on ONE GPU: DRM/KMS master is exclusive per card, and
# Sunshine captures the dummy surface via XShm (capture = x11).
#
# WARNING (verified, gamescope 3.17): dummy displays are SOFTWARE-rendered.
# No GLX -> llvmpipe. And Vulkan X11 presentation needs DRI3, which dummy
# does not provide and never can (DRI3 requires KMS, KMS requires DRM
# master — held by the GPU-backed capsule's X server). Proton/DXVK games
# here fall back to software GL. A dummy capsule is a light capsule; give
# demanding capsules a GPU-backed display or their own GPU.
#
# SYNTAX NOTES (dummy 0.4.x — verified against upstream source):
#   * VideoRam is a BARE Device-section entry, NOT an Option: the driver's
#     option table contains only "SWcursor", so Option "VideoRam" is silently
#     ignored and the 4 MB default survives -> fatal
#     "Virtual size (1920x1080) exceeds video memory".
#   * A Monitor with no explicit HorizSync/VertRefresh gets a 65 MHz pixel
#     clock cap that prunes the 148.5 MHz 1080p modeline; specifying ranges
#     disables the cap (monitor.maxPixClock stays 0 -> clock check skipped).

Section "Device"
    Identifier "dummy"
    Driver     "dummy"
    # 64 MB of emulated VRAM: 1920x1080 @ 32bpp needs ~8.3 MB, default is 4 MB.
    VideoRam   65536
EndSection

Section "Monitor"
    Identifier "monitor"
    HorizSync   30-90
    VertRefresh 50-75
    Modeline "1920x1080" 148.50 1920 2008 2052 2200 1080 1084 1089 1125 +hsync +vsync
    Option   "PreferredMode" "1920x1080"
EndSection

Section "Screen"
    Identifier   "screen"
    Device       "dummy"
    Monitor      "monitor"
    DefaultDepth 24
    SubSection "Display"
        Depth  24
        Virtual 1920 1080
        Modes  "1920x1080"
    EndSubSection
EndSection

Section "ServerLayout"
    Identifier "layout"
    Screen     "screen"
    Option     "AutoAddDevices" "true"
    Option     "AutoAddGPU"     "false"
EndSection

Section "ServerFlags"
    Option "DontVTSwitch"       "true"
    Option "AllowMouseOpenFail" "true"
EndSection

Section "InputClass"
    Identifier  "no-grab"
    MatchDevicePath "/dev/input/event*"
    Option      "GrabDevice" "false"
EndSection
