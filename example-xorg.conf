# Capsule Xorg config — headless dummy display.
#
# Each capsule gets one of these; ALL 3D rendering still happens on the real
# GPU via its render node (/dev/dri/renderD*). Dummy provides a RAM-backed
# X screen so N capsules can coexist on ONE GPU: DRM/KMS master is exclusive
# per card, but render nodes allow unlimited concurrent clients, and Sunshine
# captures the dummy surface via XShm (capture = x11).
#
# Games: Vulkan (incl. Proton/DXVK) renders on the GPU via GBM/render nodes.
# GLX-accelerated (OpenGL) apps fall back to llvmpipe — plan around Vulkan.

Section "Device"
    Identifier "dummy"
    Driver     "dummy"
    # Defaults are 4096 kB / 65 MHz — too small for 1080p32bpp (~8.3 MB) and
    # for the 148.5 MHz modeline below. Without VideoRam Xorg dies with
    # "Virtual size (1920x1080) exceeds video memory".
    Option     "VideoRam"     "65536"
    Option     "MaxClock"     "600000"
    Option     "ConstantDPMS" "true"
EndSection

Section "Monitor"
    Identifier "monitor"
    Modeline "1920x1080" 148.50 1920 2008 2052 2200 1080 1084 1089 1125 +hsync +vsync
    Option   "PreferredMode" "1920x1080"
    Option   "Enable" "true"
EndSection

Section "Screen"
    Identifier   "screen"
    Device       "dummy"
    Monitor      "monitor"
    DefaultDepth 24
    SubSection "Display"
        Depth  24
        Virtual 1920 1080
        Modes  "1920x1080"
    EndSubSection
EndSection

Section "ServerLayout"
    Identifier "layout"
    Screen     "screen"
    Option     "AutoAddDevices" "true"
    Option     "AutoAddGPU"     "false"
EndSection

Section "ServerFlags"
    Option "DontVTSwitch"       "true"
    Option "AllowMouseOpenFail" "true"
EndSection

Section "InputClass"
    Identifier  "no-grab"
    MatchDevicePath "/dev/input/event*"
    Option      "GrabDevice" "false"
EndSection
