# Capsule Xorg config — GPU-backed display (hardware GLX/OpenGL).
#
# For ONE capsule per GPU: this X server claims DRM master on the card, which
# gives it hardware-accelerated GLX (Steam UI, native-GL games) in addition to
# Vulkan (hardware for ALL capsules via the render node regardless).
#
# A second GPU-backed X server on the same card CANNOT work ('device is not
# DRM master'); additional capsules use the shared dummy xorg.conf instead —
# their Vulkan/Proton games still render on the GPU.
#
# preconfig-xorg.sh generates /etc/X11/capsule/xorg.<N>.conf from this
# template for every index listed in CAPSULE_GPU_DISPLAYS, substituting
# __KMSDEV__ with CAPSULE_KMSDEV (default /dev/dri/card1 — resolve it on the
# host via /dev/dri/by-path, never guess).

Section "Device"
    Identifier "amdgpu"
    Driver     "amdgpu"
    Option     "kmsdev"   "__KMSDEV__"
    Option     "DRI"      "3"
EndSection

Section "Monitor"
    Identifier "monitor"
    Modeline "1920x1080" 148.50 1920 2008 2052 2200 1080 1084 1089 1125 +hsync +vsync
    Option   "PreferredMode" "1920x1080"
EndSection

Section "Screen"
    Identifier   "screen"
    Device       "amdgpu"
    Monitor      "monitor"
    DefaultDepth 24
    SubSection "Display"
        Depth  24
        Modes  "1920x1080"
    EndSubSection
EndSection

Section "ServerLayout"
    Identifier "layout"
    Screen     "screen"
    Option     "AutoAddDevices" "true"
    Option     "AutoAddGPU"     "false"
EndSection

Section "ServerFlags"
    Option "DontVTSwitch"       "true"
    Option "AllowMouseOpenFail" "true"
EndSection

Section "InputClass"
    Identifier  "no-grab"
    MatchDevicePath "/dev/input/event*"
    Option      "GrabDevice" "false"
EndSection
